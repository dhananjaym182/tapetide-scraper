name: smoke

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  smoke-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Compile check
        run: python -m py_compile tapetide_downloader/tapetide_downloader.py tapetide_downloader/batch_download.py

      - name: Offline smoke test (no network)
        run: python tapetide_downloader/test_smoke.py
